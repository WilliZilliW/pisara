# Builds the official release from a tag: the Play Store bundle (AAB) and a public APK, both signed with the
# upload key.
#  - Push a tag like v1.1 or v1.1.2, or run by hand (Actions → Play-julkaisu → Run workflow) with a version.
#  - The APK is published as the GitHub release of the tag, marked latest, so
#    https://github.com/WilliZilliW/pisara/releases/latest/download/Pisara.apk is always the newest official
#    version. A run started by hand publishes nothing.
#  - The AAB is uploaded to Google Play (track from the repository variable PLAY_TRACK, default "alpha" =
#    closed testing; release notes from kauppa/julkaisutiedote/) when the secret PLAY_SERVICE_ACCOUNT_JSON
#    exists. It is also kept as an artifact of the run for one day, never attached to the release. (The repo
#    is public, so any signed-in GitHub user could download a release or a long-lived artifact.)
# Versions become versionCodes as major*10000 + minor*100 + patch (see android/app/build.gradle).
# Note: Play re-signs its copy with Google's app signing key, so an APK installed from GitHub and one from
# Play cannot update each other; switching between them means uninstalling first.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   PISARA_UPLOAD_KEYSTORE_BASE64  the upload key file, base64-encoded
#   PISARA_KEYSTORE_PASSWORD       its keystore password
#   PISARA_KEY_ALIAS               the key alias
#   PISARA_KEY_PASSWORD            the key password
#   PLAY_SERVICE_ACCOUNT_JSON      (optional) Google Play service account key, allowed to release this app
# Only the repository owner can push tags or run workflows by hand, and no workflow here runs on pull
# requests, so forks never get the secrets.
name: Play-julkaisu

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versio:
        description: 'Versio, esim. 1.1'
        required: true

permissions:
  contents: write   # creates the release of the tag

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.versio }}
        run: |
          if [ "$EVENT" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="$INPUT_VERSION"; fi
          case "$V" in
            ''|*[!0-9.]*|.*|*.|*..*) echo "::error::Versio '$V' ei kelpaa: käytä muotoa 1.2 tai 1.2.3"; exit 1 ;;
          esac
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        env:
          KS: ${{ secrets.PISARA_UPLOAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.PISARA_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.PISARA_KEY_ALIAS }}
          KP: ${{ secrets.PISARA_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing PISARA_UPLOAD_KEYSTORE_BASE64"
          [ -n "$SP" ] || missing="$missing PISARA_KEYSTORE_PASSWORD"
          [ -n "$KA" ] || missing="$missing PISARA_KEY_ALIAS"
          [ -n "$KP" ] || missing="$missing PISARA_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Puuttuvat salaisuudet:$missing"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build the game for the app (www/)
        run: |
          npm ci --ignore-scripts
          sh tools/sovellus.sh
          npx cap sync android

      - name: Build signed AAB
        working-directory: android
        env:
          V: ${{ steps.version.outputs.v }}
          KEYSTORE_BASE64: ${{ secrets.PISARA_UPLOAD_KEYSTORE_BASE64 }}
          PISARA_KEYSTORE_PASSWORD: ${{ secrets.PISARA_KEYSTORE_PASSWORD }}
          PISARA_KEY_ALIAS: ${{ secrets.PISARA_KEY_ALIAS }}
          PISARA_KEY_PASSWORD: ${{ secrets.PISARA_KEY_PASSWORD }}
        run: |
          export PISARA_KEYSTORE_FILE="$RUNNER_TEMP/upload-key"
          trap 'rm -f "$PISARA_KEYSTORE_FILE"' EXIT   # the key file never outlives this step, even if the build fails
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$PISARA_KEYSTORE_FILE"
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease -PpisaraVersion="$V" --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "../Pisara-$V.aab"
          cp app/build/outputs/apk/release/app-release.apk "../Pisara-$V.apk"

      - name: Verify signature
        env:
          V: ${{ steps.version.outputs.v }}
        run: |
          jarsigner -verify "Pisara-$V.aab" | tee verify.txt
          grep -q "jar verified" verify.txt
          keytool -printcert -jarfile "Pisara-$V.aab" | grep -m1 Owner
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "Pisara-$V.apk" | grep -m1 "certificate DN"

      - uses: actions/upload-artifact@v4
        with:
          name: Pisara-${{ steps.version.outputs.v }}-aab
          path: Pisara-${{ steps.version.outputs.v }}.aab
          retention-days: 1

      # Play upload: only for tags, and only once the service account secret exists (until then it is skipped
      # and the AAB is uploaded by hand from the artifact). If the upload fails, the job stops before the
      # GitHub release, so GitHub and Play stay on the same version.
      - name: Check Play upload
        id: play
        if: github.event_name == 'push'
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
        run: |
          if [ -n "$SA" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
            echo "track=$TRACK" >> "$GITHUB_OUTPUT"
            echo "Ladataan Playhin kanavalle $TRACK"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON puuttuu, joten Play-lataus ohitetaan. Lataa AAB ajon liitteestä käsin."
          fi

      - name: Upload to Google Play
        if: steps.play.outputs.upload == 'true'
        # pinned to the commit of v1.1.5: this step handles the service account key
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fi.otsosoft.pisara
          releaseFiles: Pisara-${{ steps.version.outputs.v }}.aab
          releaseName: ${{ steps.version.outputs.v }}
          track: ${{ steps.play.outputs.track }}
          status: completed
          whatsNewDirectory: kauppa/julkaisutiedote

      - name: Publish the APK as the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.v }}
        run: |
          mkdir -p dist && cp "Pisara-$V.apk" dist/Pisara.apk
          gh release create "$GITHUB_REF_NAME" dist/Pisara.apk \
            --title "Pisara $V" \
            --latest \
            --notes "Pisaran virallinen versio $V Androidille.

          Asennus: lataa Pisara.apk puhelimella ja avaa se. Android kysyy luvan asentaa sovelluksia tästä lähteestä.
          Uusi versio asentuu GitHubista asennetun edellisen päälle, ja edistyminen säilyy.

          Jos olet asentanut Pisaran Google Playsta, päivitä Playn kautta. GitHubin ja Playn versiot on allekirjoitettu eri avaimilla, joten ne eivät asennu toistensa päälle."
