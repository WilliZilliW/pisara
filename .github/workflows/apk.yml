# Builds the Android test version (APK) from every push to main and publishes it as the pre-release "testi",
# replacing the previous one. It is signed with the public test key (android/testiavain.keystore) and does not
# install over the official version (releases v1.x, signed with the upload key, see julkaisu.yml).
# Newest test APK: https://github.com/WilliZilliW/pisara/releases/download/testi/Pisara.apk
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The Android SDK comes preinstalled on GitHub's Ubuntu runners (ANDROID_HOME), licenses accepted

      - name: Build the game for the app (www/)
        run: |
          npm ci --ignore-scripts
          sh tools/sovellus.sh
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PpisaraBuild=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Pisara.apk

      # A single rolling release: the previous "latest" release and tag are replaced by the newest build of main
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          MSG=$(git log -1 --pretty=%s)
          gh release delete testi --cleanup-tag --yes || true
          gh release delete latest --cleanup-tag --yes || true   # the test release's earlier name
          gh release create testi Pisara.apk \
            --target "${{ github.sha }}" \
            --title "Pisara testiversio $N" \
            --prerelease --latest=false \
            --notes "Testiversio Androidille, tehty mainin uusimmasta muutoksesta: $MSG

          Asennus: lataa Pisara.apk puhelimella ja avaa se. Android kysyy luvan asentaa sovelluksia tästä lähteestä.
          Uusi testiversio asentuu edellisen päälle, ja edistyminen säilyy. Testiversio on allekirjoitettu eri avaimella kuin virallinen versio, joten ne eivät asennu toistensa päälle."
