apply plugin: 'com.android.application'

// Versions:
//  - Play releases: -PpisaraVersion=1.1.2 (the release workflow takes it from the tag v1.1.2).
//    versionCode = major*10000 + minor*100 + patch, so it always grows with the version and is above 1,
//    the code of the very first upload.
//  - Test builds: -PpisaraBuild=<run number> from the APK workflow.
//  - Neither: 1 / "1.0", as in the first Play upload built in Android Studio.
def pisaraVersion = project.findProperty('pisaraVersion')
def pisaraBuild = project.findProperty('pisaraBuild')
def versionCodeOf = { String v ->
    def parts = v.tokenize('.').collect { it as int }
    if (parts.size() < 1 || parts.size() > 3 || parts.drop(1).any { it > 99 }) {
        throw new GradleException("Versio '$v' ei kelpaa: käytä muotoa 1.2 tai 1.2.3, toinen ja kolmas osa enintään 99")
    }
    while (parts.size() < 3) parts << 0
    parts[0] * 10000 + parts[1] * 100 + parts[2]
}

// Play release signing: the upload key comes from environment variables (GitHub secrets in the release
// workflow). Without them a release build is unsigned, and Android Studio's "Generate Signed App Bundle"
// signs it with the key you choose there.
def uploadKeystore = System.getenv('PISARA_KEYSTORE_FILE')

android {
    namespace = "fi.otsosoft.pisara"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fi.otsosoft.pisara"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode(pisaraVersion ? versionCodeOf(pisaraVersion) : (pisaraBuild ?: '1') as int)
        versionName(pisaraVersion ?: (pisaraBuild ? "1.0-testi.${pisaraBuild}" : "1.0"))
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Test versions (debug) are signed with a fixed key kept in the repo, so updates install over each other
    // on every machine and in GitHub Actions. Its password is Android's public default; Play releases use your own key.
    signingConfigs {
        debug {
            storeFile rootProject.file('testiavain.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (uploadKeystore) {
            upload {
                storeFile file(uploadKeystore)
                storePassword System.getenv('PISARA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PISARA_KEY_ALIAS')
                keyPassword System.getenv('PISARA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (uploadKeystore) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
